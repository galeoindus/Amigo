<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} Changelog — {{DATE}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8f9fb;
      --border: #e4e7ec;
      --timeline-line: #d1d5db;
      --timeline-dot: #374151;
      --text: #111827;
      --text-body: #374151;
      --text-dim: #6b7280;
      --link: #2563eb;

      --accent-new: #059669;
      --accent-improved: #0891b2;
      --accent-fixed: #be123c;
      --accent-hood: #6b7280;

      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    @page {
      size: A4;
      margin: 20mm 18mm 25mm 18mm;

      @bottom-center {
        content: "{{FOOTER}}";
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 8pt;
        color: #6b7280;
      }
      @bottom-right {
        content: "Page " counter(page) " of " counter(pages);
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 8pt;
        color: #6b7280;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      font-size: 10.5pt;
      line-height: 1.55;
      color: var(--text-body);
      background: var(--bg);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ── Header ──────────────────────────────────── */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header__branding { flex: 1; }

    .header__eyebrow {
      font-family: var(--font-mono);
      font-size: 7.5pt;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .header__title {
      font-size: 20pt;
      font-weight: 800;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 4px;
    }

    .header__date {
      font-size: 10.5pt;
      font-weight: 500;
      color: var(--text-dim);
    }

    .header__logo {
      height: 32px;
      width: auto;
      margin-top: 2px;
      flex-shrink: 0;
    }

    /* ── Summary ─────────────────────────────────── */

    .summary {
      background: var(--surface);
      border-left: 3px solid var(--text-dim);
      border-radius: 0 8px 8px 0;
      padding: 12px 16px;
      margin-bottom: 28px;
      font-size: 10pt;
      line-height: 1.6;
      color: var(--text);
      font-weight: 500;
    }

    /* ── Timeline ──────────────────────────────────
       Uses border-left (not a ::before pseudo-element)
       so the vertical line repeats across every page
       in WeasyPrint's paged media model. */

    .timeline {
      border-left: 2px solid var(--timeline-line);
      padding-left: 26px;
    }

    .changelog-section {
      margin-bottom: 24px;
      break-inside: auto;
    }

    .changelog-section__heading {
      position: relative;
      font-size: 8.5pt;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
      padding-bottom: 4px;
      break-after: avoid;
      page-break-after: avoid;
    }

    .changelog-section--new .changelog-section__heading { color: var(--accent-new); }
    .changelog-section--improved .changelog-section__heading { color: var(--accent-improved); }
    .changelog-section--fixed .changelog-section__heading { color: var(--accent-fixed); }
    .changelog-section--hood .changelog-section__heading { color: var(--accent-hood); }

    /* ── Entries ─────────────────────────────────── */

    .changelog-entry {
      position: relative;
      break-inside: avoid;
      page-break-inside: avoid;
      padding: 0 0 36px 0;
      margin-bottom: 0;
    }

    .changelog-entry::before {
      content: '';
      position: absolute;
      left: -32px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--timeline-dot);
      border: 2px solid var(--bg);
      box-shadow: 0 0 0 1.5px var(--timeline-dot);
    }

    .changelog-entry__title {
      font-size: 11.5pt;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .changelog-entry__contributors {
      font-family: var(--font-mono);
      font-size: 8.5pt;
      color: var(--text-dim);
      margin-bottom: 8px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .changelog-entry__date {
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    .changelog-entry__contributors strong {
      font-weight: 500;
      color: var(--text-body);
    }

    .changelog-entry__contributors a {
      color: var(--link);
      text-decoration: none;
    }

    .changelog-entry__text {
      font-size: 9.5pt;
      line-height: 1.6;
      color: var(--text-body);
    }

    /* ── Empty state ─────────────────────────────── */

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
      font-size: 11pt;
      font-style: italic;
    }

    /* ── Screen only ─────────────────────────────── */

    @media screen {
      body {
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 20px;
        background: #eef0f4;
      }
      .header__title { font-size: 26pt; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header__branding">
      <div class="header__eyebrow">{{EYEBROW}}</div>
      <h1 class="header__title">{{TITLE}}</h1>
      <div class="header__date">{{DATE_LONG}}</div>
    </div>
    <img class="header__logo" src="{{LOGO}}" alt="Logo">
  </header>

  <div class="summary">
    {{SUMMARY}}
  </div>

  <div class="timeline">
    {{SECTIONS}}
  </div>

</body>
</html>
