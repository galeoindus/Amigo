name: Amigo package validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate structure, brand strings, assets and syntax
        run: python scripts/validate_package.py

      - name: Syntax-check every bundled script
        run: python -m compileall -q scripts

      - name: Smoke-test the offline helpers
        run: |
          set -euo pipefail
          printf '%s' '{"control_success":1000,"control_n":5000,"treatment_success":1100,"treatment_n":5000}' > /tmp/ab.json
          python scripts/statistical-inference/proportion_test.py --input /tmp/ab.json > /dev/null

          printf '%s' '[{"user_id":"u1","event":"signup","ts":1},{"user_id":"u1","event":"activation","ts":2},{"user_id":"u2","event":"signup","ts":1}]' > /tmp/events.json
          python scripts/product-analytics/funnel.py --input /tmp/events.json --steps signup,activation > /dev/null

          printf '%s' '[{"dimension":"A","before":100,"after":80},{"dimension":"B","before":100,"after":95}]' > /tmp/slices.json
          python scripts/segmentation-drilldown/contribution_analysis.py --input /tmp/slices.json > /dev/null

          printf '%s' '[{"date":"2026-01-05","value":10},{"date":"2026-01-06","value":11},{"date":"2026-01-12","value":20}]' > /tmp/series.json
          python scripts/time-series-analysis/baseline.py --input /tmp/series.json > /dev/null

          echo "helper smoke tests passed"
